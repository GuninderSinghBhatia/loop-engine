[project]
name = "loop-engine"
version = "0.1.0"
description = "Self-building loop: plan, build, test and fix a small Python project from one prompt."
authors = [
    { name = "GuninderSinghBhatia", email = "guninder.growth@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.7.0",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
loop = "loop_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loop_engine"]
