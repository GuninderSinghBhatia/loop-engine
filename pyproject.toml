[project]
name = "loop-engine"
version = "0.1.0"
description = "Self-building loop: plan, build, test and fix a small Python project from one prompt."
authors = [
    { name = "GuninderSinghBhatia", email = "guninder.growth@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.7.0",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

